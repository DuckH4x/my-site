<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница Хацкера</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* --- БАЗА И ЦВЕТА --- */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d1117; /* Темный фон, чтобы не было белых полос */
            overflow: hidden; /* Запрещаем скролл на ПК */
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            perspective: 1000px; 
            position: relative;
        }

        /* --- ЧАСЫ --- */
        .clock {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 50;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .clock:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        /* --- ФОНЫ (С ЗАПАСОМ ДЛЯ АНИМАЦИИ) --- */
        .bg-layer { 
            position: fixed; 
            top: -50%; left: -50%; width: 200vw; height: 200vh; /* Огромный фон */
            background-size: cover; background-position: center; 
            z-index: -2; opacity: 0; transition: opacity 1s ease-in-out; 
            will-change: transform; /* Включаем аппаратное ускорение */
        }
        #bg-1 { background-image: url('https://images.unsplash.com/photo-1478719059408-592965723cbc?q=80&w=1920&auto=format&fit=crop'); opacity: 1; }
        #bg-2 { background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1920&auto=format&fit=crop'); }
        #bg-3 { background-image: url('https://images.unsplash.com/photo-1483347756197-71ef80e95f73?q=80&w=1920&auto=format&fit=crop'); }
        
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 15, 25, 0.6); z-index: -1; pointer-events: none; }

        /* --- Левая панель (Работы) --- */
        .left-sidebar {
            position: fixed;
            left: 40px; 
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 15;
        }

        .sidebar-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 15px;
            padding: 15px 20px; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .sidebar-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(5px); border-color: rgba(255,255,255,0.4); }
        .sidebar-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- Контейнер --- */
        .app-wrapper {
            display: flex;
            align-items: center;
            justify-content: center; 
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
        }

        /* --- Карточка Профиля --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
            padding: 40px 30px; text-align: center; width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: absolute;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
            animation: breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 8px 40px 0 rgba(100, 150, 255, 0.15); }
        }

        .app-wrapper.music-open .profile-card { transform: translateX(-200px); }

        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); margin-bottom: 15px; object-fit: cover; transition: transform 0.5s ease, border-color 0.3s ease; cursor: pointer; }
        .avatar:hover { transform: scale(1.1) rotate(5deg); border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .avatar.spin { animation: spinAvatar 0.8s ease-in-out; }
        @keyframes spinAvatar { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.2) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }

        .subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #b0c4de; margin-bottom: 5px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 25px; letter-spacing: 1px; background: linear-gradient(135deg, #ffffff 0%, #a0b0ff 50%, #ff9e9e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% 200%; animation: gradientMove 4s ease infinite; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .social-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .social-btn { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; background: rgba(255, 255, 255, 0.08); padding: 10px; border-radius: 12px; width: 70px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255, 255, 255, 0.1); position: relative; overflow: hidden; }
        .social-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-8px) scale(1.1); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .social-btn svg { width: 26px; height: 26px; margin-bottom: 5px; fill: currentColor; transition: transform 0.3s ease; }
        .social-btn:hover svg { transform: scale(1.2) rotate(-10deg); }
        .social-btn span { font-size: 10px; white-space: nowrap; }

        .bottom-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; }
        .btn:hover { background: rgba(255, 255, 255, 0.2); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .btn.active-music { background: #fff; color: #000; border-color: #fff; font-weight: bold; }

        /* --- Карточка Музыки --- */
        .music-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 30px; width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); z-index: 9;
            position: absolute;
            opacity: 0;
            transform: translateX(100px);
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
            will-change: transform, opacity;
            display: flex; flex-direction: column;
        }
        .music-card.show { opacity: 1; transform: translateX(200px); pointer-events: auto; }

        .music-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .album-cover { width: 70px; height: 70px; border-radius: 10px; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=200&auto=format&fit=crop') center/cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex-shrink: 0; }
        .track-info { flex: 1; text-align: left; }
        .track-info h3 { font-size: 18px; margin-bottom: 3px; }
        .track-info p { font-size: 13px; color: #b0c4de; }
        
        .header-controls { display: flex; gap: 5px; }
        .icon-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
        .icon-btn:hover { background: rgba(255,255,255,0.3); }

        .visualizer { display: flex; align-items: flex-end; justify-content: space-between; height: 50px; gap: 3px; margin-bottom: 20px; opacity: 0.7; }
        .bar { flex: 1; background: #fff; border-radius: 2px 2px 0 0; height: 10%; }

        .player-controls { margin-top: 5px; }
        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #b0c4de; margin-bottom: 15px; }
        .progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: #fff; border-radius: 2px; }
        .progress-fill::after { content: ''; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

        .buttons-row { display: flex; align-items: center; justify-content: space-between; }
        .ctrl-btn { background: transparent; border: none; color: #fff; cursor: pointer; opacity: 0.7; transition: all 0.3s; padding: 5px; }
        .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }
        .play-btn { background: #fff; color: #000; width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .play-btn:hover { transform: scale(1.1); background: #e0e0e0; }
        
        .volume-container { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { -webkit-appearance: none; width: 60px; background: transparent; cursor: pointer; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #fff; margin-top: -4px; }

        /* Плейлист */
        .playlist { position: absolute; top: 70px; left: 0; width: 100%; background: rgba(20, 25, 35, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 15px; padding: 15px; z-index: 30; display: none; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .playlist.show { display: flex; }
        .playlist-item { padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); cursor: pointer; transition: background 0.3s; display: flex; justify-content: space-between; }
        .playlist-item:hover { background: rgba(255,255,255,0.15); }
        .playlist-item.active { background: rgba(255,255,255,0.25); font-weight: bold; }

        /* --- Модальное окно работ --- */
        .works-modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20, 25, 35, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            padding: 30px; width: 400px; max-width: 90vw;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); z-index: 100;
            display: none; flex-direction: column; gap: 15px;
            opacity: 0; transition: all 0.4s ease;
        }
        .works-modal.show { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .works-modal h2 { text-align: center; margin-bottom: 10px; }
        .work-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-decoration: none; color: #fff; transition: all 0.3s ease; display: flex; justify-content: space-between; align-items: center; }
        .work-item:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; opacity: 0.7; }
        .close-modal:hover { opacity: 1; }

        /* --- Панель фонов --- */
        .bg-selector { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 10px; display: flex; gap: 10px; z-index: 20; }
        .bg-option { background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #aaa; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.3s ease; }
        .bg-option:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .bg-option.active { background: #fff; color: #000; font-weight: bold; border-color: #fff; }

        .snowflake { position: fixed; top: -10px; background: white; border-radius: 50%; pointer-events: none; opacity: 0.6; z-index: 1; filter: blur(0.5px); }

        /* =========================================
           МОБИЛЬНАЯ ВЕРСИЯ (Экраны меньше 900px)
           ========================================= */
        @media (max-width: 900px) {
            html, body { overflow-y: auto; overflow-x: hidden; } /* Разрешаем скролл только на мобильных */
            body { 
                height: auto; 
                min-height: 100vh;
                padding: 80px 0 120px 0; 
                display: block; 
            }
            
            /* На телефоне отключаем анимацию фона, чтобы не жрало батарею */
            .bg-layer { transition: opacity 1s ease-in-out; }
            .bg-layer.parallax-active { transform: none !important; }

            .clock { top: 15px; right: 15px; font-size: 18px; padding: 8px 15px; }

            .app-wrapper { flex-direction: column; height: auto; gap: 20px; margin: 0 auto; }

            .profile-card {
                position: relative;
                transform: none !important; 
                width: 90vw;
                max-width: 380px;
                margin: 0 auto;
            }

            .music-card {
                position: relative;
                transform: translateY(-20px) !important; 
                width: 90vw;
                max-width: 380px;
                display: none; 
                margin: 0 auto;
            }
            .music-card.show { display: flex; transform: translateY(0) !important; }

            .left-sidebar {
                top: 20px; left: 50%; transform: translateX(-50%); flex-direction: row;
            }
            .sidebar-btn { padding: 10px 20px; }

            .bg-selector { bottom: 10px; padding: 8px; gap: 5px; }
            .bg-option { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>

        <!-- Плеер -->
        <div class="music-card" id="music-card">
            <div class="music-header">
                <div class="album-cover"></div>
                <div class="track-info">
                    <h3>На заре</h3>
                    <p>Альянс</p>
                </div>
                <div class="header-controls">
                    <button class="icon-btn" onclick="togglePlaylist()" title="Список песен">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <button class="icon-btn" onclick="togglePlayer()" title="Свернуть">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
                    </button>
                </div>
            </div>

            <div class="playlist" id="playlist">
                <div class="playlist-item active" onclick="selectTrack('На заре', 'Альянс')">
                    <span>На заре</span>
                    <span style="color:#b0c4de; font-size:12px;">Альянс</span>
                </div>
            </div>

            <div class="visualizer" id="visualizer"></div>

            <div class="player-controls">
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>

                <div class="buttons-row">
                    <button class="ctrl-btn" onclick="alert('Предыдущий трек в разработке')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="play-btn" id="play-pause-btn" onclick="toggleMusic()">
                        <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pause-icon" style="display:none;" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl-btn" onclick="alert('Следующий трек в разработке')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <div class="volume-container">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volume-slider">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно работ -->
    <div class="works-modal" id="works-modal">
        <button class="close-modal" onclick="toggleWorks()">✕</button>
        <h2>Мои работы</h2>
        <a href="#" class="work-item" target="_blank">
            <span>Сайт-визитка</span>
            <span style="color:#aaa; font-size:12px;">HTML/CSS</span>
        </a>
        <a href="#" class="work-item" target="_blank">
            <span>Discord Бот</span>
            <span style="color:#aaa; font-size:12px;">Python</span>
        </a>
        <a href="#" class="work-item" target="_blank">
            <span>Игра на Unity</span>
            <span style="color:#aaa; font-size:12px;">C#</span>
        </a>
        <p style="text-align:center; color:#777; font-size:12px; margin-top:10px;">Замени ссылки в коде на свои</p>
    </div>

    <div class="bg-selector">
        <button class="bg-option active" onclick="changeBg(1, this)">Фон 1</button>
        <button class="bg-option" onclick="changeBg(2, this)">Фон 2</button>
        <button class="bg-option" onclick="changeBg(3, this)">Фон 3</button>
    </div>

    <audio id="bg-music" loop>
        <source src="na-zare.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <script>
        const appWrapper = document.getElementById('app-wrapper');
        const musicCard = document.getElementById('music-card');
        const toggleMusicBtn = document.getElementById('toggle-music-btn');
        const music = document.getElementById('bg-music');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const visualizer = document.getElementById('visualizer');
        const avatar = document.getElementById('avatar');
        const volumeSlider = document.getElementById('volume-slider');
        const playlist = document.getElementById('playlist');
        const worksModal = document.getElementById('works-modal');
        const clockEl = document.getElementById('clock');

        // --- ЧАСЫ ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockEl.textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- МУЗЫКА ---
        music.volume = volumeSlider.value;
        volumeSlider.addEventListener('input', (e) => { music.volume = e.target.value; });

        function togglePlayer() {
            musicCard.classList.toggle('show');
            appWrapper.classList.toggle('music-open');
            
            if (musicCard.classList.contains('show')) {
                toggleMusicBtn.textContent = 'Скрыть музыку';
                toggleMusicBtn.classList.add('active-music');
            } else {
                toggleMusicBtn.textContent = '🎵 Открыть музыку';
                toggleMusicBtn.classList.remove('active-music');
                playlist.classList.remove('show');
            }
        }

        function toggleMusic() {
            if (music.paused) {
                music.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                music.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        function togglePlaylist() { playlist.classList.toggle('show'); }

        function selectTrack(title, artist) {
            document.querySelector('.track-info h3').textContent = title;
            document.querySelector('.track-info p').textContent = artist;
            playlist.classList.remove('show');
        }

        function toggleWorks() {
            worksModal.classList.toggle('show');
        }

        music.addEventListener('timeupdate', () => {
            const current = music.currentTime;
            const duration = music.duration || 0;
            if (duration) {
                progressFill.style.width = (current / duration) * 100 + '%';
                currentTimeEl.textContent = formatTime(current);
                totalTimeEl.textContent = formatTime(duration);
            }
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            music.currentTime = ((e.clientX - rect.left) / rect.width) * music.duration;
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        for (let i = 0; i < 30; i++) {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            visualizer.appendChild(bar);
        }

        setInterval(() => {
            if (!music.paused && musicCard.classList.contains('show')) {
                document.querySelectorAll('.bar').forEach(bar => { bar.style.height = Math.random() * 80 + 10 + '%'; });
            } else {
                document.querySelectorAll('.bar').forEach(bar => { bar.style.height = '10%'; });
            }
        }, 150);

        function changeBg(index, btnElement) {
            document.querySelectorAll('.bg-layer').forEach(layer => layer.style.opacity = '0');
            document.getElementById(`bg-${index}`).style.opacity = '1';
            document.querySelectorAll('.bg-option').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // --- ПАРАЛЛАКС (Только для ПК) ---
        document.addEventListener('mousemove', (e) => {
            // Проверяем, что это не мобилка
            if (window.innerWidth > 900) { 
                const x = (e.clientX / window.innerWidth - 0.5);
                const y = (e.clientY / window.innerHeight - 0.5);
                
                document.querySelectorAll('.bg-layer').forEach(layer => {
                    // Огромный фон (200vw), поэтому двигаем его чуть-чуть
                    layer.style.transform = `translate(${x * -50}px, ${y * -50}px)`;
                });
            }
        });

        avatar.addEventListener('click', () => {
            avatar.classList.add('spin');
            setTimeout(() => avatar.classList.remove('spin'), 800);
        });

        function createSnow() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            const size = Math.random() * 4 + 2;
            snowflake.style.width = size + 'px';
            snowflake.style.height = size + 'px';
            snowflake.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 5 + 5;
            snowflake.style.animation = `fall ${duration}s linear infinite`;
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(snowflake);
            setTimeout(() => snowflake.remove(), duration * 1000);
        }
        setInterval(createSnow, 100);

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
